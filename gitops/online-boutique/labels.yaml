# Adds the app.kubernetes.io/name label to every Deployment and its pods.
# The label is what alert rules, log labels and Heimdall use as `service`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  labels:
    app.kubernetes.io/name: adservice
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adservice
---
