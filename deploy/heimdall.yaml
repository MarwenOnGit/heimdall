# Heimdall itself. ${HEIMDALL_IMAGE}, ${HEIMDALL_LLM_PROVIDER}, ${OPA_IMAGE} and
# ${HEIMDALL_POLICY_HASH} are filled in by infra/bootstrap.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heimdall-data
  namespace: heimdall
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall
  namespace: heimdall
  labels: {app.kubernetes.io/name: heimdall}
spec:
  replicas: 1
  # One writer for the SQLite file: stop the old pod before starting the new.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: heimdall}
  template:
    metadata:
      labels: {app.kubernetes.io/name: heimdall}
      annotations:
        # Restarts the pod when the policy changes.
        heimdall.io/policy-hash: "${HEIMDALL_POLICY_HASH}"
    spec:
      # The pod runs as the read-only identity. The actor identity's token is
      # mounted separately and used only by the executor.
      serviceAccountName: heimdall-readonly
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: heimdall
          image: ${HEIMDALL_IMAGE}
          ports: [{containerPort: 8000, name: http}]
          env:
            - name: HEIMDALL_ALERT_TOKEN
              valueFrom:
                secretKeyRef: {name: heimdall-alert-token, key: token}
            - {name: HEIMDALL_DB, value: /data/heimdall.sqlite}
            - {name: HEIMDALL_PROMETHEUS_URL, value: "http://kps-prometheus.monitoring.svc:9090"}
            - {name: HEIMDALL_DEPENDENCIES, value: /app/docs/dependencies.yaml}
            - {name: HEIMDALL_AUDIT_KEY, value: /keys/audit.key}
            - {name: HEIMDALL_GITEA_URL, value: "http://gitea-http.gitea.svc:3000"}
            - name: HEIMDALL_GITEA_TOKEN
              valueFrom:
                secretKeyRef: {name: heimdall-gitea, key: token}
            - {name: HEIMDALL_LOKI_URL, value: "http://loki.monitoring.svc:3100"}
            - {name: HEIMDALL_NAMESPACES, value: boutique}
            - {name: HEIMDALL_LLM_PROVIDER, value: "${HEIMDALL_LLM_PROVIDER}"}
            - {name: HEIMDALL_LLM_MODEL, value: "qwen3:8b"}
            - {name: HEIMDALL_OLLAMA_URL, value: "http://ollama.heimdall.svc:11434"}
            # A local model is slow; give it more time than an API model needs.
            - {name: HEIMDALL_MAX_INVESTIGATION_SECONDS, value: "600"}
            # dry_run: plan, check policy, and send allowed actions to the API
            # server as dry runs. Nothing in the cluster is changed.
            - {name: HEIMDALL_MODE, value: dry_run}
            - {name: HEIMDALL_ACTOR_TOKEN_FILE, value: /var/run/heimdall/actor/token}
            - {name: HEIMDALL_OPA_URL, value: "http://127.0.0.1:8181"}
            # Signs approval tokens. Without it, actions that need approval
            # are escalated instead.
            - name: HEIMDALL_APPROVAL_SECRET
              valueFrom:
                secretKeyRef: {name: heimdall-approval-secret, key: secret}
            # Optional chat webhook (Discord or Slack) for notifications:
            #   kubectl -n heimdall create secret generic heimdall-webhook --from-literal=url=...
            - name: HEIMDALL_WEBHOOK
              valueFrom:
                secretKeyRef: {name: heimdall-webhook, key: url, optional: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: audit-key, mountPath: /keys, readOnly: true}
            - {name: actor-token, mountPath: /var/run/heimdall/actor, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        # The policy engine. It listens on localhost only, so nothing outside
        # the pod can query or reconfigure it.
        - name: opa
          image: ${OPA_IMAGE}
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - --disable-telemetry
            - /policies
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: policy, mountPath: /policies, readOnly: true}
      volumes:
        - name: policy
          configMap: {name: heimdall-policy}
        - name: actor-token
          secret:
            secretName: heimdall-actor-token
            items: [{key: token, path: token}]
        - name: data
          persistentVolumeClaim: {claimName: heimdall-data}
        - name: audit-key
          secret: {secretName: heimdall-audit-key}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall
  namespace: heimdall
  labels: {app.kubernetes.io/name: heimdall}
spec:
  selector: {app.kubernetes.io/name: heimdall}
  ports: [{port: 8000, targetPort: http, name: http}]
---
# Only Alertmanager (alerts) and Prometheus (metrics) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: heimdall-ingress
  namespace: heimdall
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: heimdall}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [alertmanager, prometheus]}
      ports: [{port: 8000}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: heimdall
  namespace: heimdall
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: heimdall}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
