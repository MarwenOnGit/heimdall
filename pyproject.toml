[project]
name = "heimdall"
version = "0.1.0"
description = "An AI SRE agent for Kubernetes with layered, agent-independent safety"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rfc8785>=0.1.4",
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
heimdall = "heimdall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heimdall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The chaos runner shells out to kubectl and docker with fixed arguments.
"chaos/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["heimdall", "chaos"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["heimdall.core.*", "heimdall.policy.*", "heimdall.executor.*"]
strict = true
