# Identity used by the Executor. It can patch Deployments in `boutique` and
# nothing else: no read, no create, no delete, nothing cluster-wide. What a
# patch may contain is limited further by infra/admission/actor-policy.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heimdall-actor
  namespace: heimdall
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-actor
  namespace: boutique
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heimdall-actor
  namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heimdall-actor
subjects:
  - kind: ServiceAccount
    name: heimdall-actor
    namespace: heimdall
---
# A token for the actor identity, as a Secret. The Heimdall pod runs as the
# read-only identity and mounts this token separately, so the two identities
# stay distinct inside one pod.
apiVersion: v1
kind: Secret
metadata:
  name: heimdall-actor-token
  namespace: heimdall
  annotations:
    kubernetes.io/service-account.name: heimdall-actor
type: kubernetes.io/service-account-token
---
# The actor may patch exactly one Argo CD Application, to pause and resume
# automatic sync around a live fix. The admission policy limits the patch to
# the sync setting.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heimdall-actor-gitops
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [boutique]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heimdall-actor-gitops
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heimdall-actor-gitops
subjects:
  - kind: ServiceAccount
    name: heimdall-actor
    namespace: heimdall
