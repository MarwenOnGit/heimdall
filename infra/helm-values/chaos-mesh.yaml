# kind nodes run containerd, not Docker. The dashboard and DNS chaos server
# are not used.
controllerManager:
  replicaCount: 1
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
  # The daemon must also run on the tainted workload node.
  tolerations:
    - key: heimdall.io/workload
      operator: Exists
      effect: NoSchedule
dashboard:
  create: false
dnsServer:
  create: false
