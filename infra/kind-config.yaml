# kind cluster for Heimdall: 1 control plane + 2 workers.
# The node image is passed on the command line from infra/versions.env.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  # Lets containerd resolve the local registry through /etc/containerd/certs.d,
  # which bootstrap.sh fills in on every node.
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
  # Infrastructure node: monitoring, Gitea, Argo CD, Linkerd, Heimdall.
  - role: worker
  # Workload node: only pods that tolerate the taint (Online Boutique) run
  # here, so the node-failure scenario can stop it without taking the
  # monitoring stack down with it.
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: heimdall.io/workload
              value: "true"
              effect: NoSchedule
