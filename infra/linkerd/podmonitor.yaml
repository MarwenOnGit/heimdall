# Scrapes the Linkerd proxy of every meshed pod in `boutique`. This is the
# source of the request success-rate and latency metrics.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [boutique]
  selector:
    matchExpressions:
      - {key: linkerd.io/control-plane-ns, operator: Exists}
  podMetricsEndpoints:
    - port: linkerd-admin
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          regex: linkerd-proxy
          action: keep
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_linkerd_io_proxy_deployment]
          targetLabel: deployment
