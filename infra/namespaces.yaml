apiVersion: v1
kind: Namespace
metadata:
  name: boutique
  annotations:
    # Every pod in the workload namespace gets a Linkerd proxy, which is where
    # per-service success rate and latency metrics come from.
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
  labels:
    linkerd.io/is-control-plane: "true"
    linkerd.io/control-plane-ns: linkerd
    config.linkerd.io/admission-webhooks: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: heimdall
