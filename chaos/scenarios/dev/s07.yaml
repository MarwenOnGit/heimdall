id: s07
description: Redis is scaled to zero. cartservice starts failing, but it is a symptom.
difficulty: hard
inject:
  - type: kubectl
    args: ["-n", "boutique", "scale", "deploy/redis-cart", "--replicas=0"]
expected_alerts:
  - alertname: HighErrorRate
    service: cartservice
ground_truth:
  - category: dependency_down
    resource:
      kind: Deployment
      namespace: boutique
      name: redis-cart
acceptable_fixes: [scale_deployment]
recovery_condition:
  - 'kube_deployment_status_replicas_available{{namespace="boutique", deployment="redis-cart"}} == 1'
  - 'heimdall:service_success_rate:ratio_rate2m{{service="cartservice"}} >= 0.99'
