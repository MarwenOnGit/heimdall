id: s09
description: The network between frontend and productcatalogservice gains {delay_ms}ms of delay.
difficulty: hard
parameters:
  delay_ms:
    int_range: [300, 700]
inject:
  - type: manifest
    content: |
      apiVersion: chaos-mesh.org/v1alpha1
      kind: NetworkChaos
      metadata:
        name: s09-delay
        namespace: boutique
      spec:
        action: delay
        mode: all
        selector:
          namespaces: [boutique]
          labelSelectors:
            app.kubernetes.io/name: frontend
        direction: to
        target:
          mode: all
          selector:
            namespaces: [boutique]
            labelSelectors:
              app.kubernetes.io/name: productcatalogservice
        delay:
          latency: "{delay_ms}ms"
expected_alerts:
  - alertname: HighLatencyP95
    service: frontend
alert_timeout_seconds: 720
ground_truth:
  - category: network_degradation
    resource:
      kind: Deployment
      namespace: boutique
      name: productcatalogservice
# No action in the catalog can fix the network.
acceptable_fixes: [escalate]
recovery_condition:
  - 'heimdall:service_latency_ms:p95_rate5m{{service="frontend"}} < 1000'
