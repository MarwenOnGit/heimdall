name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # opa is needed by the policy gate tests.
      - run: infra/tools.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: infra/tools.sh
      - run: .bin/opa fmt --fail --list heimdall/policy/policies/
      - run: .bin/opa test heimdall/policy/policies/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x infra/*.sh infra/*/*.sh infra/admission/tests/*.sh deploy/*.sh fault-images/*.sh
